version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - bodyclose
    - errorlint
    - nilerr
    - copyloopvar
    - durationcheck
    - makezero
    - prealloc
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      # Writing help text and tables to stdout cannot fail in a way the process
      # can act on, and checking every Fprintf buries the code that matters.
      # Every other write path, including the store, stays checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    misspell:
      locale: US
      # Vietnamese source data and identifiers trip the spell checker.
      ignore-rules:
        - vie
        - nam
        - hoa

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
